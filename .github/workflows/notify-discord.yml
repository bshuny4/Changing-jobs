name: Notify Discord

# reports/ に新しい日次レポートが push されたら Discord に通知する。
#
# なぜ Actions 経由なのか:
#   Routine が動く実行環境は discord.com への通信がネットワークポリシーで
#   ブロックされている（403）。GitHub のランナーには制限がないため、
#   ここから Webhook を叩く。

on:
  push:
    paths:
      - 'reports/**.md'
  workflow_dispatch:
    inputs:
      report_path:
        description: '通知したいレポートのパス（例: reports/2026-08-05.md）。空なら最新を自動選択'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 通知するレポートを決める
        id: pick
        env:
          INPUT_PATH: ${{ github.event.inputs.report_path }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_PATH:-}" ]; then
            target="$INPUT_PATH"
          else
            # この push で追加/変更された日次レポート（reports/YYYY-MM-DD.md）のうち最新のもの。
            # candidates.md や weekly/ 配下は対象外。
            target=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'reports/*.md' \
              | grep -E '^reports/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' \
              | sort | tail -1 || true)
          fi

          if [ -z "$target" ] || [ ! -f "$target" ]; then
            echo "通知対象の日次レポートなし。スキップします。"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "通知対象: $target"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "path=$target" >> "$GITHUB_OUTPUT"
          fi

      - name: Discord に投稿
        if: steps.pick.outputs.found == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_PATH: ${{ steps.pick.outputs.path }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL が未設定です。"
            echo "::warning::Settings → Secrets and variables → Actions で登録してください。"
            exit 0
          fi
          python3 .github/scripts/post_to_discord.py
